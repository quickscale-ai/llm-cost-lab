# Règles de dev-automation pour ce dépôt. Ce fichier est interdit à l'agent de code,
# et toute PR qui le modifie attend une relecture humaine.
base: main
guardrail_paths:
  - ".dev-automation.yml"
  - "src/lib/pricing.ts"
cadrage:
  direct: true
  max_files: 3
  max_lines: 150
  tech_leads:
    - HMohQuickscale
quality:
  max_files_changed: 10
